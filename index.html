<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos<span>_</span></h2>
        <div class="botoes">

            <button class="botao">Comprar notebook</button>
            <button class="botao">Comprar Red Dead Redemption</button>

        <div class="abas-textos">

                <h3 class="aba-conteudo-titulo-principal"> Concluir ensino médio </h3>

                <div class="contador"> 30 dias </div>

            <div class="aba-conteudo">

            <div class="aba-conteudo">

                <h4 class="aba-conteudo-titulo-secundario"> Tempo para completar o objetivo </h4>
                <div class="contador"> 20 dias </div>
            </div>
            <div class="aba-conteudo">
                <h3 class="aba-conteudo-titulo-principal"> Entrar em uma faculdade partícular </h3>

        </div>

        </div>
